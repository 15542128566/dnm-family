<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNM Family - 一起玩的好兄弟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部菜单栏 -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="brand-logo">DNM</span>
            <span class="brand-name">Family</span>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item active" data-page="members">人物介绍</a>
            <a href="#" class="nav-item" data-page="games">团队游戏</a>
            <a href="#" class="nav-item" data-page="honor">荣誉墙</a>
            <a href="#" class="nav-item" data-page="footprint">足迹</a>
            <a href="#" class="nav-item" data-page="gallery">精彩瞬间</a>
            <a href="#" class="nav-item" data-page="about">关于我们</a>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main class="content">
        <!-- 人物介绍页面 -->
        <section id="page-members" class="page active">
            <h2 class="page-title">团队成员</h2>
            <p class="page-subtitle">悬停查看每位成员的详细信息</p>
            <div id="member-list" class="member-list"></div>
        </section>

        <!-- 团队游戏页面 -->
        <section id="page-games" class="page">
            <h2 class="page-title">团队游戏</h2>
            <p class="page-subtitle">我们常玩的游戏，点击选项卡查看擅长选手</p>
            <div id="games-tabs" class="game-tabs"></div>
            <div id="games-panel" class="game-panel"></div>
        </section>

        <!-- 荣誉墙页面 -->
        <section id="page-honor" class="page">
            <h2 class="page-title">荣誉墙</h2>
            <p class="page-subtitle">每一场战斗都值得被铭记</p>
            <div id="honor-list" class="honor-list"></div>
        </section>

        <!-- 足迹页面 -->
        <section id="page-footprint" class="page">
            <h2 class="page-title">足迹</h2>
            <p class="page-subtitle">我们生活的地方，我们一起走过的山与海</p>
            <div class="map-legend">
                <span class="legend-item"><i class="legend-dot legend-home"></i>常驻基地</span>
                <span class="legend-item"><i class="legend-dot legend-trip"></i>旅游足迹</span>
            </div>
            <div class="map-wrapper">
                <div id="china-map" class="china-map"></div>
            </div>
        </section>

        <!-- 精彩瞬间页面 -->
        <section id="page-gallery" class="page">
            <h2 class="page-title">精彩瞬间</h2>
            <p class="page-subtitle">记录每一次开黑的欢乐时光</p>
            <div class="placeholder-box">
                <span>📸 照片墙即将上线</span>
            </div>
        </section>

        <!-- 关于我们页面 -->
        <section id="page-about" class="page">
            <h2 class="page-title">关于我们</h2>
            <p class="page-subtitle">一群热爱游戏的好兄弟</p>
            <div class="placeholder-box">
                <span>✨ 团队介绍即将上线</span>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 DNM Family · 一起玩才好玩</p>
    </footer>

    <script src="lib/echarts.min.js"></script>
    <script src="map.js"></script>
    <script src="script.js"></script>
</body>
</html>
